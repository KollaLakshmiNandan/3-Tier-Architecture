global:
  scrape_interval: 5s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

rule_files:
  - "/etc/prometheus/alerts/slo-alerts.yaml"

scrape_configs:
  - job_name: "claims-backend"
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:5000"]
