
apiVersion: v1
kind: Service
metadata:
  name: claims-frontend
  namespace: {{ .Values.namespace }}
spec:
  type: ClusterIP
  selector:
    app: claims-frontend
  ports:
    - name: http
      port: 8080
      targetPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: claims-backend
  namespace: {{ .Values.namespace }}
spec:
  type: ClusterIP
  selector:
    app: claims-backend
  ports:
    - name: http
      port: 5000
      targetPort: 5000

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: {{ .Values.namespace }}
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432

