
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: usecase16-dev
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://gitlab.com/midhtech-group3/3-tier-architecture.git
    targetRevision: feature/usecase16
    path: usecase16/helm
    helm:
      releaseName: usecase16

  destination:
    server: https://kubernetes.default.svc
    namespace: usecase16-lab

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

