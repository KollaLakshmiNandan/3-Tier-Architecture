variables:
  PATH: "/Applications/Docker.app/Contents/Resources/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"

stages:
  - test
  - sonarqube
  - docker
  - scan
  - publish
  - dev
  - stage
  - prod-like

# =========================
# USE CASE 1
# =========================

unit_test:
  stage: test
  tags:
    - macos
  script:
    - cd backend
    - python3 -m venv .venv
    - .venv/bin/python -m pip install -r requirements.txt
    - .venv/bin/python -m unittest test_app.py

sonarqube-check:
  stage: sonarqube
  tags:
    - macos
  script:
    - docker run --rm
      -e SONAR_HOST_URL="$SONAR_HOST_URL"
      -e SONAR_TOKEN="$SONAR_TOKEN"
      -v "$CI_PROJECT_DIR:/usr/src"
      sonarsource/sonar-scanner-cli

docker-build:
  stage: docker
  tags:
    - macos
  script:
    - docker build --provenance=false --sbom=false -t claims-backend:$CI_COMMIT_SHORT_SHA ./backend

trivy-scan:
  stage: scan
  tags:
    - macos
  script:
    - export PATH="/opt/homebrew/bin:$PATH"
    - trivy image --exit-code 0 --severity HIGH,CRITICAL claims-backend:$CI_COMMIT_SHORT_SHA

publish-image:
  stage: publish
  tags:
    - macos
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - docker tag claims-backend:$CI_COMMIT_SHORT_SHA $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA


# =========================
# USE CASE 2
# PROMOTE RELEASE
# =========================

deploy-dev:
  stage: dev
  tags:
    - macos
  script:
    - kubectl config current-context
    - kubectl get namespace dev
    - kubectl set image deployment/claims-backend
      3-tier-architecture=$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
      -n dev
    - kubectl rollout status deployment/claims-backend -n dev --timeout=120s
    - kubectl get deployment claims-backend -n dev
      -o jsonpath='{.spec.template.spec.containers[*].image}{"\n"}'
  environment:
    name: dev


promote-stage:
  stage: stage
  tags:
    - macos
  when: manual
  script:
    - kubectl config current-context
    - kubectl get namespace stage
    - kubectl set image deployment/claims-backend
      3-tier-architecture=$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
      -n stage
    - kubectl rollout status deployment/claims-backend -n stage --timeout=120s
    - kubectl get deployment claims-backend -n stage
      -o jsonpath='{.spec.template.spec.containers[*].image}{"\n"}'
  environment:
    name: stage


promote-prod-like:
  stage: prod-like
  tags:
    - macos
  when: manual
  script:
    - kubectl config current-context
    - kubectl get namespace prod-like
    - kubectl set image deployment/claims-backend
      3-tier-architecture=$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
      -n prod-like
    - kubectl rollout status deployment/claims-backend -n prod-like --timeout=120s
    - kubectl get deployment claims-backend -n prod-like
      -o jsonpath='{.spec.template.spec.containers[*].image}{"\n"}'
  environment:
    name: prod-like


rollback-prod-like:
  stage: prod-like
  tags:
    - macos
  when: manual
  script:
    - kubectl config current-context
    - kubectl rollout undo deployment/claims-backend -n prod-like
    - kubectl rollout status deployment/claims-backend -n prod-like --timeout=120s
    - kubectl get deployment claims-backend -n prod-like
      -o jsonpath='{.spec.template.spec.containers[*].image}{"\n"}'
    - kubectl rollout history deployment/claims-backend -n prod-like
  environment:
    name: prod-like