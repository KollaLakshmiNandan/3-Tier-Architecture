apiVersion: v1
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush           5
        Log_Level       info
        Daemon          off
        Parsers_File    /fluent-bit/etc/parsers.conf
        HTTP_Server     On
        HTTP_Listen     0.0.0.0
        HTTP_Port       2020

    [INPUT]
        Name              tail
        Path              /var/log/containers/*_usecase18-lab_*.log
        Parser            cri
        Tag               kube.*
        DB                /var/fluent-bit/state/flb_kube.db
        Mem_Buf_Limit     5MB
        Skip_Long_Lines   On
        Refresh_Interval  5

    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_Tag_Prefix     kube.var.log.containers.
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Merge_Log           On
        Keep_Log            Off

    [OUTPUT]
        Name                es
        Match               kube.*
        Host                elasticsearch
        Port                9200
        Logstash_Format     On
        Logstash_Prefix     claims-logs
        Suppress_Type_Name  On
        Generate_ID         On
        Retry_Limit         False
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: usecase18-lab
