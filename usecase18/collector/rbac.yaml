apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluent-bit
  namespace: usecase18-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluent-bit-usecase18
rules:
  - apiGroups: [""]
    resources:
      - pods
      - namespaces
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fluent-bit-usecase18
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fluent-bit-usecase18
subjects:
  - kind: ServiceAccount
    name: fluent-bit
    namespace: usecase18-lab
