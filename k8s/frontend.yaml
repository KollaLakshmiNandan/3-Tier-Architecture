apiVersion: apps/v1
kind: Deployment
metadata:
  name: claims-frontend
  namespace: claims-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: claims-frontend
  template:
    metadata:
      labels:
        app: claims-frontend
    spec:
      containers:
        - name: frontend
          image: devopshub-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: claims-frontend
  namespace: claims-dev
spec:
  selector:
    app: claims-frontend
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
