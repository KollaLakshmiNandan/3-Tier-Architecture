apiVersion: apps/v1
kind: Deployment
metadata:
  name: claims-postgres
  namespace: claims-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: claims-postgres
  template:
    metadata:
      labels:
        app: claims-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: claims-config
                  key: DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: claims-config
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: claims-secret
                  key: DB_PASSWORD
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - claimsuser
                - -d
                - claimsdb
            initialDelaySeconds: 5
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: claims-postgres
  namespace: claims-dev
spec:
  selector:
    app: claims-postgres
  ports:
    - port: 5432
      targetPort: 5432
