apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: claims-postgres-data
  namespace: usecase14-lab
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: claims-postgres-init
  namespace: usecase14-lab
data:
  01-schema.sql: |
    CREATE TABLE IF NOT EXISTS users (
        id SERIAL PRIMARY KEY,
        name VARCHAR(100) NOT NULL,
        email VARCHAR(150) UNIQUE NOT NULL,
        password_hash TEXT NOT NULL,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    CREATE TABLE IF NOT EXISTS claims (
        id SERIAL PRIMARY KEY,
        claim_number VARCHAR(20) UNIQUE,
        customer_name VARCHAR(100) NOT NULL,
        amount NUMERIC(12,2) NOT NULL,
        description TEXT,
        status VARCHAR(20) DEFAULT 'Pending',
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    CREATE SEQUENCE IF NOT EXISTS claim_number_seq START 1;

    CREATE OR REPLACE FUNCTION generate_claim_number()
    RETURNS TRIGGER AS $$
    BEGIN
        NEW.claim_number :=
            'CLM-' || LPAD(nextval('claim_number_seq')::TEXT, 4, '0');
        RETURN NEW;
    END;
    $$ LANGUAGE plpgsql;

    DROP TRIGGER IF EXISTS claim_number_trigger ON claims;

    CREATE TRIGGER claim_number_trigger
    BEFORE INSERT ON claims
    FOR EACH ROW
    WHEN (NEW.claim_number IS NULL)
    EXECUTE FUNCTION generate_claim_number();

    GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO claimsuser;
    GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO claimsuser;
---
apiVersion: v1
kind: Service
metadata:
  name: claims-postgres
  namespace: usecase14-lab
spec:
  selector:
    app: claims-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: claims-postgres
  namespace: usecase14-lab
spec:
  serviceName: claims-postgres
  replicas: 1
  selector:
    matchLabels:
      app: claims-postgres
  template:
    metadata:
      labels:
        app: claims-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: claims-db-secret
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: claims-db-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: claims-db-secret
                  key: POSTGRES_PASSWORD
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: postgres-init
              mountPath: /docker-entrypoint-initdb.d/01-schema.sql
              subPath: 01-schema.sql
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: claims-postgres-data
        - name: postgres-init
          configMap:
            name: claims-postgres-init
