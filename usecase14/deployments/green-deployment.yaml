apiVersion: apps/v1
kind: Deployment
metadata:
  name: green-app
  namespace: usecase14-lab
  labels:
    app: blue-green-demo
    version: green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: blue-green-demo
      version: green
  template:
    metadata:
      labels:
        app: blue-green-demo
        version: green
    spec:
      containers:
        - name: web
          image: nginx:1.28
          ports:
            - containerPort: 80
          command: ["/bin/sh", "-c"]
          args:
            - "echo GREEN-VERSION-2 > /usr/share/nginx/html/index.html && exec nginx -g 'daemon off;'"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
