apiVersion: v1
kind: Service
metadata:
  name: usecase15-postgres
  namespace: usecase15-dev
spec:
  selector:
    app: usecase15-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: usecase15-postgres
  namespace: usecase15-dev
spec:
  serviceName: usecase15-postgres
  replicas: 1
  selector:
    matchLabels:
      app: usecase15-postgres
  template:
    metadata:
      labels:
        app: usecase15-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: usecase15-postgres-secret
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 10
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
