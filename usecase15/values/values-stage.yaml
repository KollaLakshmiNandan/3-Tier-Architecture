environment: stage
namespace: claims-stage

frontend:
  replicaCount: 2

backend:
  replicaCount: 2

resources:
  frontend:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  backend:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi

config:
  logLevel: INFO

database:
  host: claims-postgres
  port: 5432
  name: claimsdb
  user: claimsuser
  secretName: claims-stage-secret
