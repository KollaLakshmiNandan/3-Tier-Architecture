environment: dev
namespace: claims-dev

frontend:
  replicaCount: 1

backend:
  replicaCount: 1

resources:
  frontend:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
  backend:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

config:
  logLevel: DEBUG

database:
  host: claims-postgres
  port: 5432
  name: claimsdb
  user: claimsuser
  secretName: claims-dev-secret
