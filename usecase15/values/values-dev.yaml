environment: dev
namespace: usecase15-dev

frontend:
  replicaCount: 1

backend:
  replicaCount: 1

resources:
  frontend:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
  backend:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

config:
  logLevel: DEBUG

database:
  host: usecase15-postgres.usecase15-dev.svc.cluster.local
  port: 5432
  name: claimsdb_dev
  user: claimsuser
  secretName: usecase15-dev-secret
