environment: qa
namespace: usecase15-qa

frontend:
  replicaCount: 1

backend:
  replicaCount: 2

resources:
  frontend:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  backend:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

config:
  logLevel: INFO

database:
  host: usecase15-postgres.usecase15-dev.svc.cluster.local
  port: 5432
  name: claimsdb_qa
  user: claimsuser
  secretName: usecase15-qa-secret
