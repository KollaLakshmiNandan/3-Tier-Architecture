environment: prod-like
namespace: usecase15-prod-like

frontend:
  replicaCount: 2

backend:
  replicaCount: 3

resources:
  frontend:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi
  backend:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

config:
  logLevel: INFO

database:
  host: usecase15-postgres.usecase15-dev.svc.cluster.local
  port: 5432
  name: claimsdb_prod
  user: claimsuser
  secretName: usecase15-prod-like-secret
