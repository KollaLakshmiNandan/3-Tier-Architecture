---
# Source: claims-management/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: claims-app-config
  namespace: claims-stage
  labels:
    app: claims-management
    environment: stage
data:
  APP_ENV: "stage"
  LOG_LEVEL: "INFO"
  DB_HOST: "claims-postgres"
  DB_PORT: "5432"
  DB_NAME: "claimsdb"
  DB_USER: "claimsuser"

---
# Source: claims-management/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: claims-app-frontend
  namespace: claims-stage
  labels:
    app: claims-management
    component: frontend
    environment: stage
spec:
  type: ClusterIP
  selector:
    app: claims-management
    component: frontend
    environment: stage
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP

---
# Source: claims-management/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: claims-app-backend
  namespace: claims-stage
  labels:
    app: claims-management
    component: backend
    environment: stage
spec:
  type: ClusterIP
  selector:
    app: claims-management
    component: backend
    environment: stage
  ports:
    - name: http
      port: 5000
      targetPort: http
      protocol: TCP

---
# Source: claims-management/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claims-app-frontend
  namespace: claims-stage
  labels:
    app: claims-management
    component: frontend
    environment: stage
spec:
  replicas: 2
  selector:
    matchLabels:
      app: claims-management
      component: frontend
      environment: stage
  template:
    metadata:
      labels:
        app: claims-management
        component: frontend
        environment: stage
    spec:
      containers:
        - name: frontend
          image: "devopshub-frontend@sha256:fcd7207178ba39d73f6150b7c54510bd927b0b63d111fca81f164fcd76534c75"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi

---
# Source: claims-management/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claims-app-backend
  namespace: claims-stage
  labels:
    app: claims-management
    component: backend
    environment: stage
spec:
  replicas: 2
  selector:
    matchLabels:
      app: claims-management
      component: backend
      environment: stage
  template:
    metadata:
      labels:
        app: claims-management
        component: backend
        environment: stage
    spec:
      containers:
        - name: backend
          image: "devopshub-backend@sha256:2a7a137cf789991fac81c5e793b49cca40af63574c4983ff41be2bd751baaddb"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: APP_ENV
              value: "stage"
            - name: LOG_LEVEL
              value: "INFO"
            - name: DB_HOST
              value: "claims-postgres"
            - name: DB_NAME
              value: "claimsdb"
            - name: DB_USER
              value: "claimsuser"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: claims-stage-secret
                  key: DB_PASSWORD
          resources:
            limits:
              cpu: 1000m
              memory: 512Mi
            requests:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
